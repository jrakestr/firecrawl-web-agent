name: Deploy MLB predictions to Vercel

on:
  push:
    branches: [main]
    paths:
      - "agent-templates/next copy/**"
      - ".github/workflows/vercel-deploy.yml"
  workflow_dispatch:

concurrency:
  group: vercel-mlb-predictions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "agent-templates/next copy"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "agent-templates/next copy/package-lock.json"

      - name: Install deps
        run: npm ci

      # Same script the agent runs locally, so CI and manual deploys cannot
      # drift. Supabase keys are optional here: when absent the script reuses
      # whatever the Vercel project already has.
      - name: Link, configure, deploy, verify
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: ./scripts/deploy-vercel.sh
